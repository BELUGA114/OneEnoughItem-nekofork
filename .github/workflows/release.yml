name: Build and Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build

      - name: Extract tag message
        run: |
          git fetch --tags --force
          MSG=$(git for-each-ref --format='%(contents)' refs/tags/${{ github.ref_name }})
          echo "TAG_MESSAGE<<EOF" >> $GITHUB_ENV
          echo "$MSG" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Prepare release artifacts
        run: |
          mkdir -p release
          cp build/libs/OEI-nekofork-fabric-mc1.21.1-*.jar release/
          rm -f release/*-sources.jar release/*-dev.jar
          cp libs/OELib-0.0.1.jar release/

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ env.TAG_MESSAGE }}
          tag_name: ${{ github.ref_name }}
          files: release/*
